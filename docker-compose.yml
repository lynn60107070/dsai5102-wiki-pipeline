# Wikipedia live edits pipeline. Start everything: docker compose up -d --build
#
# Running now: broker -> kafka-init -> producer -> raw-sink -> minio (data lake)
# Added later (see SCHEDULE.md): airflow + postgres (L5), dbt (L6), processor (L7), metabase (L6/S9)
#
# All data lives in Docker named volumes, never in this (OneDrive-synced) folder.

name: wiki-pipeline

services:

  # Kafka in KRaft mode, single broker (same image and settings as the Kafka lab).
  # Containers use broker:29092; scripts on your laptop use localhost:9092.
  broker:
    image: confluentinc/cp-kafka:8.0.0
    hostname: broker
    container_name: broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'   # topics are created explicitly by kafka-init
      # The lab used /tmp, which is wiped when the container is recreated; this path is on the volume.
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topics once, then exits. wiki.raw keeps 3 days: the raw zone is the real archive,
  # Kafka only needs enough history to replay after a sink outage.
  kafka-init:
    image: confluentinc/cp-kafka:8.0.0
    depends_on:
      broker:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "kafka-topics --bootstrap-server broker:29092 --create --if-not-exists
      --topic wiki.raw --partitions 3 --replication-factor 1 --config retention.ms=259200000
      && kafka-topics --bootstrap-server broker:29092 --describe --topic wiki.raw"

  # Wikimedia EventStreams -> wiki.raw
  producer:
    build:
      context: .
      dockerfile: stream/Dockerfile
    image: wiki-pipeline/stream
    command: python -m stream.producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      WIKI_USER_AGENT: ${WIKI_USER_AGENT:?copy .env.example to .env and set WIKI_USER_AGENT}
      STATE_DIR: /state
    volumes:
      - collector_state:/state

  # wiki.raw -> raw zone of the lake: s3://lake/raw/edits/dt=/hour=/part-*.jsonl.gz
  raw-sink:
    image: wiki-pipeline/stream
    command: python -m stream.raw_sink
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      producer:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      FLUSH_SECONDS: ${FLUSH_SECONDS:-300}
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
      DATA_DIR: /data   # only for the one-off backfill of pre-MinIO files (stream.backfill_local)
    volumes:
      - raw_data:/data

  # Data lake (S3 API). MinIO stopped publishing free official images in 2025; this is the last
  # free MinIO build, archived by Bitnami, pinned so it never changes under us.
  # API on :9000, web console on http://localhost:9001 (log in with the .env credentials).
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
      MINIO_DEFAULT_BUCKETS: lake
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  kafka_data:
  raw_data:          # pre-MinIO raw files (25 Oct); delete once backfilled and verified
  collector_state:
  minio_data:
