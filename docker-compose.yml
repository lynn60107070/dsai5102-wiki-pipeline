# Wikipedia live edits pipeline. Start everything: docker compose up -d --build
#
# Stream:  broker -> kafka-init -> producer -> wiki.raw -> raw-sink -> minio raw zone
#                                              wiki.raw -> processor -> edits.bot / edits.human -> clean-sink x2 -> minio clean zone
#                                                                    -> edits.per_minute -> live-stats -> postgres serving
# Batch:   postgres <- airflow-init -> airflow-webserver + airflow-scheduler (DAG: pageviews_hourly)
# Warehouse: dbt + DuckDB (inside the Airflow image) -> scripts/export_marts.py -> Postgres `serving`
# Dashboard: metabase (reads `serving` with a read-only user)
#
# All data lives in Docker named volumes, never in this (OneDrive-synced) folder.

name: wiki-pipeline

# Shared settings for every Airflow container (same pattern as the official Airflow compose file from
# the lab, cut down to LocalExecutor: no Celery, no Redis, much lighter on a laptop).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile   # official apache/airflow:2.11.2-python3.12 + dbt in its own venv
  image: wiki-pipeline/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: UTC
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # MinIO as an Airflow connection (conn id `minio_lake`), used by the DAGs through S3Hook.
    AIRFLOW_CONN_MINIO_LAKE: >-
      {"conn_type": "aws", "login": "${MINIO_ROOT_USER}", "password": "${MINIO_ROOT_PASSWORD}",
      "extra": {"endpoint_url": "http://minio:9000", "region_name": "us-east-1"}}
    WIKI_USER_AGENT: ${WIKI_USER_AGENT}
    PYTHONPATH: /opt/airflow/project
    # dbt + DuckDB warehouse (profiles in dbt/profiles.yml read these)
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    WAREHOUSE_PATH: /opt/airflow/warehouse/wiki.duckdb
    DBT_PROJECT_DIR: /opt/airflow/project/dbt
    DBT_PROFILES_DIR: /opt/airflow/project/dbt
    DBT_TARGET_PATH: /opt/airflow/warehouse/dbt-target
    DBT_LOG_PATH: /opt/airflow/logs/dbt
    DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ingest:/opt/airflow/project/ingest
    - ./dbt:/opt/airflow/project/dbt
    - ./scripts:/opt/airflow/project/scripts
    - airflow_logs:/opt/airflow/logs
    - warehouse:/opt/airflow/warehouse
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:

  # Kafka in KRaft mode, single broker (same image and settings as the Kafka lab).
  # Containers use broker:29092; scripts on your laptop use localhost:9092.
  broker:
    image: confluentinc/cp-kafka:8.0.0
    hostname: broker
    container_name: broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'   # topics are created explicitly by kafka-init
      # The lab used /tmp, which is wiped when the container is recreated; this path is on the volume.
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topics once, then exits. wiki.raw keeps 3 days: the raw zone is the real archive,
  # Kafka only needs enough history to replay after a sink outage.
  kafka-init:
    image: confluentinc/cp-kafka:8.0.0
    depends_on:
      broker:
        condition: service_healthy
    restart: "no"
    # topic : partitions : retention (ms). 3 days = 259200000, 1 day = 86400000, 7 days = 604800000.
    command: >
      bash -c "for spec in wiki.raw:3:259200000 edits.bot:3:259200000 edits.human:3:259200000
      edits.per_minute:1:86400000 wiki.deadletter:1:604800000; do
      IFS=: read topic parts keep <<< \"$$spec\";
      kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic $$topic
      --partitions $$parts --replication-factor 1 --config retention.ms=$$keep || exit 1; done
      && kafka-topics --bootstrap-server broker:29092 --list"

  # Wikimedia EventStreams -> wiki.raw
  producer:
    build:
      context: .
      dockerfile: stream/Dockerfile
    image: wiki-pipeline/stream
    command: python -m stream.producer
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      WIKI_USER_AGENT: ${WIKI_USER_AGENT:?copy .env.example to .env and set WIKI_USER_AGENT}
      STATE_DIR: /state
    volumes:
      - collector_state:/state

  # wiki.raw -> raw zone of the lake: s3://lake/raw/edits/dt=/hour=/part-*.jsonl.gz
  raw-sink:
    image: wiki-pipeline/stream
    command: python -m stream.raw_sink
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      producer:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      FLUSH_SECONDS: ${FLUSH_SECONDS:-300}
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
      DATA_DIR: /data   # only for the one-off backfill of pre-MinIO files (stream.backfill_local)
    volumes:
      - raw_data:/data

  # wiki.raw -> validate + clean (user names dropped) -> edits.bot / edits.human / edits.per_minute,
  # failures -> wiki.deadletter
  processor:
    image: wiki-pipeline/stream
    command: python -m stream.processor
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      producer:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: broker:29092

  # edits.bot + edits.human -> clean zone (Parquet). Consumer group of 2: Kafka shares the 6
  # partitions between the replicas. Scale with: docker compose up -d --scale clean-sink=3
  clean-sink:
    image: wiki-pipeline/stream
    command: python -m stream.clean_sink
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      replicas: 2
    depends_on:
      processor:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      FLUSH_SECONDS: ${FLUSH_SECONDS:-300}
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # edits.per_minute -> Postgres serving.live_edits_per_minute (near-real-time dashboard tile)
  live-stats:
    image: wiki-pipeline/stream
    command: python -m stream.live_stats
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      processor:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: broker:29092
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # Data lake (S3 API). MinIO stopped publishing free official images in 2025; this is the last
  # free MinIO build, archived by Bitnami, pinned so it never changes under us.
  # API on :9000, web console on http://localhost:9001 (log in with the .env credentials).
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
      MINIO_DEFAULT_BUCKETS: lake
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Postgres: databases `airflow` (Airflow metadata), `serving` (dashboard tables, read-only for
  # Metabase) and `metabase` (Metabase's own settings). postgres/init/ creates them on first start.
  # Host port 5433, because 5432 is often taken by a lab Postgres.
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: airflow
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-off: creates/upgrades Airflow's tables and the web login, then exits.
  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?copy .env.example to .env}

  # Web UI: http://localhost:8080 (log in with AIRFLOW_ADMIN_USER / AIRFLOW_ADMIN_PASSWORD from .env)
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Dashboard: http://localhost:3000. Its own settings live in Postgres database `metabase`;
  # the data it shows comes from `serving` (connection set up by scripts/metabase_setup.py).
  metabase:
    image: metabase/metabase:v0.64.3.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: airflow
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
      JAVA_OPTS: -Xmx1g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  kafka_data:
  raw_data:          # pre-MinIO raw files (25 Oct); delete once backfilled and verified
  collector_state:
  minio_data:
  postgres_data:
  airflow_logs:
  warehouse:         # DuckDB file + dbt artefacts
