# No secrets here: everything comes from environment variables set by docker-compose.yml.
wiki:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', '/opt/airflow/warehouse/wiki.duckdb') }}"
      threads: 4
      extensions: [httpfs]
      # DuckDB defaults to 80% of RAM and every CPU thread. Next to 13 other containers in 8 GB that
      # made the Docker VM swap until everything froze (26 Oct); capped, it spills to disk instead
      # (default spill folder: wiki.duckdb.tmp next to the warehouse file). Don't set temp_directory
      # here: dbt re-applies these settings on every connection and DuckDB can't change it once used.
      settings:
        TimeZone: UTC
        memory_limit: 1500MB
        threads: 4
        preserve_insertion_order: false
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ROOT_USER') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
          endpoint: "{{ env_var('S3_ENDPOINT_HOST', 'minio:9000') }}"
          url_style: path
          use_ssl: false
